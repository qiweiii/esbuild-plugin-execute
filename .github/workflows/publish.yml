name: Stage npm release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag (for example, v1.0.0)'
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: read

concurrency:
  group: npm-stage-${{ inputs.tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify and pack the tagged release
    if: github.repository == 'qiweiii/esbuild-plugin-execute' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.release.outputs.commit }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      GOSUMDB: 'off'
      GOWORK: 'off'
    steps:
      - name: Validate the tag input
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Use a stable release tag such as v1.0.0.' >&2
            exit 1
          fi

      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify package identity, version, and commit
        id: release
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, 'esbuild-plugin-execute');
          assert.equal(`v${pkg.version}`, process.env.RELEASE_TAG);
          assert.equal(pkg.repository.url, 'git+https://github.com/qiweiii/esbuild-plugin-execute.git');
          NODE
          git merge-base --is-ancestor HEAD origin/main
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.1
          cache: false

      - name: Install pinned package managers
        run: npm install --global --ignore-scripts npm@12.2.0 pnpm@12.8.1

      - name: Audit the locked dependencies
        run: pnpm audit --audit-level=high

      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting, lint, and types
        run: |
          pnpm format:check
          pnpm lint
          pnpm types
          unformatted=$(gofmt -l test/fixtures/callback.go test/http-plugin-example/*/main.go)
          if [[ -n "$unformatted" ]]; then
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Run integration tests and build both module formats
        run: pnpm test

      - name: Pack the npm artifact
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/npm-package
        run: |
          mkdir -p "$PACKAGE_DIRECTORY"
          npm pack --ignore-scripts --pack-destination "$PACKAGE_DIRECTORY"
          git diff --exit-code

      - name: Upload the verified tarball
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage the verified package on npm
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.commit }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Install the pinned npm CLI
        run: npm install --global --ignore-scripts npm@12.2.0

      - name: Download the verified tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package

      - name: Stage using npm Trusted Publishing
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/npm-package
        run: |
          archives=("$PACKAGE_DIRECTORY"/*.tgz)
          if [[ ${#archives[@]} -ne 1 || ! -f "${archives[0]}" ]]; then
            echo 'Expected exactly one verified package tarball.' >&2
            exit 1
          fi
          npm stage publish "${archives[0]}" --ignore-scripts --provenance --access public --tag latest --registry https://registry.npmjs.org
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ## Package staged for review
          Review the stage ID in the logs and approve the package in npm's **Staged Packages** tab with 2FA.
          This workflow does not publish publicly or approve staged packages.
          SUMMARY
